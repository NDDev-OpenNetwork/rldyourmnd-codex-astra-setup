# Managed by codex-setup-system — setup `standard`.
#
# Two things are settled so far: the autonomy posture and the context window.
# Nothing else belongs in this file yet.
#
# Every key below was validated with `codex exec --strict-config`, which is the
# only instrument here that rejects a key that does not exist. See
# docs/measurements.md.

model = "gpt-6-astra"

# ── Reasoning ───────────────────────────────────────────────────────────────
#
# `xhigh` — chosen for how Astra actually works, not as a midpoint.
#
# This key is **not optional on this model.** Left unset, the session header
# reads `reasoning effort: none`, and the request then fails outright with
#
#     Unsupported value: 'none' is not supported with the 'gpt-6-astra' model
#
# before the agent answers at all (openai/codex#44184). Astra accepts `low`,
# `medium`, `high`, `xhigh` and `max`; this build's catalog additionally offers
# `ultra`, which delegates to sub-tasks and so does not belong in a posture that
# runs without subagents.
model_reasoning_effort = "xhigh"

# The only window into what a high effort actually bought. Without summaries an
# `xhigh` turn is indistinguishable from a cheap one until the invoice arrives.
# Accepted: auto, concise, detailed, none.
model_reasoning_summary = "detailed"

# ── Full auto ───────────────────────────────────────────────────────────────
#
# This pair is exactly what `--yolo` sets. Verified by comparing session
# headers: both produce `approval: never · sandbox: danger-full-access`, where
# the default is `approval: never · sandbox: workspace-write`.
#
# `--full-auto` was removed at 0.155.1 and `--skip-permissions` belongs to a
# different product; neither is used here.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# ── Response style ──────────────────────────────────────────────────────────
#
# `pragmatic` of `none | friendly | pragmatic`.
#
# `medium` is documented as the product default for verbosity, so this row
# states it rather than changes it. It is written down because the default is
# the right value here and a later reader should know that was decided, not
# inherited by accident.
personality = "pragmatic"
model_verbosity = "medium"

# ── Budgets ─────────────────────────────────────────────────────────────────
#
# Chosen by arithmetic against this posture's own numbers, not by copying a
# recommendation.
#
# The usable context is 828400 and compaction fires at 700000, so a session has
# 700000 tokens of room. Against that:
#
#     tool_output_token_limit    whole file        outputs before compaction
#              12000              ~46 KB                    58
#              32000             ~125 KB                    21
#              65000             ~253 KB                    10
#
# Published guidance puts 12000 at "most development workflows". This posture is
# not most workflows: **there are no subagents**, so a large read cannot be
# delegated and absorbed elsewhere. A truncated read is re-read in pieces, and
# the pieces cost more than the whole would have. 46 KB truncates real source
# files; 125 KB does not, and 21 such reads still fit before compaction, where
# 65000 would leave only 10.
tool_output_token_limit = 32000

# Default is 32768, and it caps the **combined** size of project documentation.
# A repository with a root AGENTS.md and nested ones can reach that, and the
# failure is silent truncation of instructions. Doubling it costs about 8000
# tokens of context in the worst case -- roughly 1% of the compaction budget --
# to remove a failure mode this repository exists to avoid.
project_doc_max_bytes = 65536

# ── Knowledge ───────────────────────────────────────────────────────────────
#
# The most capable of the four modes this build names -- `disabled`, `cached`,
# `indexed`, `live` -- where the product default is `cached`. Astra's knowledge
# cutoff is 2026-04-30, so without live search it cannot see what changed after
# that date.
web_search = "live"

# ── Context ─────────────────────────────────────────────────────────────────
#
# 872000 is the ceiling. It is not a compromise on the way to 1M -- it is what
# "1M long-context mode" amounts to in this build:
#
#     context_window                    272000   the default, and the price cliff
#     max_context_window                872000   the ceiling
#     effective_context_window_percent      95   -> 828400 usable
#     supports_experimental_context      false
#
# The 1.05M figure is the API model's window. Codex exposes 872000, and the
# `/extended-context` toggle does not raise it.
model_context_window = 872000

# **The key is `model_auto_compact_token_limit`, with the `model_` prefix.**
# `auto_compact_token_limit` is a field of the model *catalog*, not of this
# file, and `--strict-config` rejects it as an unknown configuration field --
# while an ordinary run accepts it silently and does nothing.
#
# 700000 against an effective ceiling of 828400 leaves 128400 tokens of headroom
# — enough for a long turn to finish rather than being compacted mid-flight.
model_auto_compact_token_limit = 700000

# ── No subagents ────────────────────────────────────────────────────────────
#
# **`agents.enabled` is the switch. The feature flag is not.**
#
# Measured on the rendered prompt (`codex debug prompt-input`), counting tool
# names with `grep -o | wc -l`:
#
#                      nothing   features.multi_agent=false   agents.enabled=false
#     spawn_agent          4               4                          0
#     followup_task        2               2                          0
#     send_message         3               3                          0
#     wait_agent           2               2                          0
#     interrupt_agent      1               1                          0
#     prompt bytes     18221           18221                      14661
#
# `features.multi_agent = false` changes the prompt by **zero bytes**. It moves
# the feature counter from `47 enabled · 0 overridden` to `46 · 1`, which is why
# an earlier revision of this file believed it worked — the counter moved and
# nothing else did.
#
# `agents.enabled = false` removes 3560 bytes and every collaboration tool. It
# is the documented control: "Enable/disable multi-agent tools", default `true`.
# It does *not* touch the feature counter, because it is not a feature.
#
# The feature flag is kept alongside it because it does flip a real flag that
# other code paths read (openai/codex#31097 reports it being honoured
# inconsistently), and costs nothing. `multi_agent_v2` was dropped: it ships off
# and is inert both ways.
[agents]
enabled = false

# ── Environment reaching the model's subprocesses ───────────────────────────
#
# `all` is the product default, and it is written down because the consequence
# has to be discovered on purpose rather than by accident.
#
# The built-in filter strips any variable whose **name** contains `KEY`,
# `SECRET` or `TOKEN`, which on this host removes `GITHUB_TOKEN`,
# `GIT_CONFIG_KEY_0..7`, `STARSHIP_SESSION_KEY` and
# `CLAUDE_CODE_MESSAGING_TOKEN`. It does **not** remove:
#
#     SSH_AUTH_SOCK · SSH_AGENT_PID · GPG_AGENT_INFO
#
# because those names contain none of the three words. So the agent socket
# reaches every command the model runs, and with no sandbox and no approvals
# that means push, force-push, commit signing and SSH to anywhere the loaded
# keys reach. That is the intended autonomy, not an oversight.
#
# `core` would cut this, and would also cut the paths that put this host's own
# tooling on PATH. `none` with an explicit `set` is what published guidance
# recommends for an unsandboxed agent; it is not what this posture wants.
[shell_environment_policy]
inherit = "all"

# ── Access ──────────────────────────────────────────────────────────────────
#
# Everything open, stated explicitly rather than left to defaults.
#
# `default_origin_policy` is a struct, not a string: `access`, `downloads` and
# `uploads` each take `allow` or `deny`, and `full_cdp_access` takes the same
# two rather than a boolean.
[browser_use]
allow_history_access = true

[browser_use.default_origin_policy]
access    = "allow"
downloads = "allow"
uploads   = "allow"

[computer_use]
default_app_access = "allow"

# ── Session history ─────────────────────────────────────────────────────────
#
# The product default, kept deliberately: `resume` and `fork` need it, and so
# does the memory generation enabled below -- there would be nothing for it to
# read.
[history]
persistence = "save-all"

# ── Memory across sessions ──────────────────────────────────────────────────
#
# `features.memories` is one of the four capabilities this build ships stable
# and disabled. Turned on here together with both halves of the behaviour:
# `use_memories` reads what has accumulated, `generate_memories` writes it.
#
# This is durable state in `$CODEX_HOME`, not session context. It persists
# across sessions by design, which is the point and also the cost.
[memories]
use_memories = true
generate_memories = true

# ── Telemetry ───────────────────────────────────────────────────────────────
#
# Both default to on.
[analytics]
enabled = false

[feedback]
enabled = false

[features]
memories = true
multi_agent = false
