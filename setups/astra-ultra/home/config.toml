# Managed by codex-setup-system — setup `astra-ultra`.
#
# The escalation posture. Same shape as `astra`, turned up where depth is worth
# more than latency and cost. Select it for a hard architectural decision or a
# debugging loop that has already failed at `high`; select `astra` back
# afterwards.
#
# Readings behind these values are in docs/measurements.md.

model = "gpt-6-astra"
model_provider = "openai"

# `ultra` is the top of Astra's six-level scale, and it is **not** simply a
# louder `max`. The catalog describes it as "Maximum reasoning with automatic
# task delegation" -- the model may spawn and coordinate sub-work on its own.
# Published write-ups list only five efforts and omit it entirely; this build's
# own catalog is what says it exists.
#
# It requires 0.155.0 or newer. On 0.154.0 the value cannot be expressed at all,
# which is the single strongest reason this repository pins a floor of 0.155.1.
model_reasoning_effort = "ultra"

# Already at the ceiling for the turn; planning gains nothing from a separate
# escalation, so it simply matches rather than pretending there is a level above.
plan_mode_reasoning_effort = "ultra"

# Compact **earlier** than `astra`, not later. The 272K surcharge threshold
# (2x input, 1.5x output) is a worse deal at this effort, because `ultra` spends
# more tokens per turn and therefore reaches the cliff sooner. 160K leaves the
# headroom that a delegating run needs before it crosses.
auto_compact_token_limit = 160000

# Non-negotiable at this effort. `ultra` may delegate work to sub-tasks, and
# without summaries that delegation is invisible -- the first evidence of what
# it chose to do would be the invoice.
model_reasoning_summary = "detailed"

web_search = "live"

approval_policy = "never"
sandbox_mode = "danger-full-access"

# `service_tier = "priority"` (Fast mode, 2x speed) is deliberately **left
# unset**. It multiplies every applicable rate by two, and stacks on top of the
# long-context surcharge -- so on a long `ultra` session it compounds with the
# very threshold `auto_compact_token_limit` above exists to avoid. Set it per
# invocation with `-c service_tier="priority"` when latency genuinely matters,
# rather than paying for it on every turn.

# The four capabilities this build ships stable-and-off at 0.155.1.
# See docs/measurements.md for why this list is four and not `full-auto`'s three.
[features]
memories = true
multi_agent_v2 = true
recommended_plugins = true
secret_auth_storage = true
