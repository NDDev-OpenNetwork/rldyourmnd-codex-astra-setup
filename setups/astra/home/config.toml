# Managed by codex-setup-system — setup `astra`.
#
# An everyday working posture for GPT-6-Astra. The escalation variant is
# `astra-ultra`; this one is what you leave installed.
#
# Every value below is either read off this build or explained. Where a
# published article and the model catalog disagreed, the catalog won. The
# readings are in docs/measurements.md.

# The catalog reports this slug as `priority 1`, `visibility: list` and
# `supported_in_api: true` on this account, so it needs no override to be
# reachable and no workaround for the gated-rollout bug (openai/codex#43342).
model = "gpt-6-astra"
model_provider = "openai"

# **This key is not optional on Astra.** Left unset, the session header reads
# `reasoning effort: none`, and `none` is the one effort Astra rejects: it
# suppresses the reasoning budget entirely, and the catalog's own scale starts
# at `low`. So an unset default is not "the model's default" here -- it is the
# single unsupported value.
#
# `high` rather than the catalog's `low`: this setup is for writing and
# debugging code, where the published guidance puts interactive work under
# roughly 100K tokens at `high`. `xhigh`, `max` and `ultra` exist and are
# carried correctly by this build -- see `astra-ultra` for the posture that
# takes them -- but they buy depth at a cost this posture does not want to pay
# on every turn.
model_reasoning_effort = "high"

# Planning is where extra depth is cheapest: it happens once per task, not once
# per turn, and a bad plan is paid for repeatedly afterwards.
plan_mode_reasoning_effort = "xhigh"

# Astra's context is 1.05M tokens, but the price is not flat across it. Above
# **272K tokens** input bills at 2x and output at 1.5x -- a cliff, not a ramp.
# Compacting at 200K keeps a long session on the near side of it with room to
# spare, and costs a compaction rather than a silent doubling.
auto_compact_token_limit = 200000

# Reasoning summaries are the only view into what a high-effort model did with
# the budget it was given. Without them, `high` and `ultra` are indistinguishable
# from the outside until the bill arrives.
model_reasoning_summary = "detailed"

# The most capable of the four modes this build names (`disabled`, `cached`,
# `indexed`, `live`). A coding model with a 2026-04-30 cutoff needs a way to
# check what changed since.
web_search = "live"

# Autonomous posture: this is a setup posture -- keys in this product's own
# configuration file -- not an execution profile, and it grants no environment
# of its own. Higher-authority layers still clamp it.
approval_policy = "never"
sandbox_mode = "danger-full-access"

# Every capability this build ships as stable and leaves off.
#
# Measured, not chosen: the 0.155.1 registry carries 142 specs, 42 of them
# stable, and exactly four of those are shipped disabled. `codex-setup-system`'s
# own `full-auto` setup documents *three* -- that sentence was true at the
# 0.151.0 pin it was measured against, and `secret_auth_storage` is the one
# that has appeared since.
[features]
memories = true
multi_agent_v2 = true
recommended_plugins = true
secret_auth_storage = true
